<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<title>EDAIN 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Gaegu:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2F3442; --sub:#7A808C; --red:#F0565B; --redD:#C23A40; --paper:#FFF9EA;
  --title:'Jua',system-ui,sans-serif; --latin:'Fredoka','Jua',system-ui,sans-serif; --hand:'Gaegu','Jua',cursive;
  --text:'Noto Sans KR',system-ui,sans-serif; --mono:'Share Tech Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#F1ECE4;color:var(--ink);font-family:var(--text);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid #4C8DFF;outline-offset:3px}
svg{display:block}
#scene{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}

/* ── 워드마크 ── */
.wordmark{display:inline-flex;align-items:baseline;gap:.18em;line-height:1}
.wordmark .ed{font-family:var(--latin);font-weight:700;color:var(--red);letter-spacing:.02em;
  text-shadow:0 .06em 0 #fff,0 .1em 0 rgba(194,58,64,.35)}
.wordmark .pp{font-family:var(--title);color:var(--ink)}
.hero{position:fixed;left:50%;top:max(22px,env(safe-area-inset-top));transform:translateX(-50%);z-index:8;text-align:center;pointer-events:none;
  transition:opacity .4s,transform .4s}
.hero .wordmark{font-size:clamp(46px,9vw,84px)}
.hero small{display:block;margin-top:8px;font-size:13px;letter-spacing:.2em;color:var(--sub);font-weight:700}
body:not([data-mode="attract"]) .hero{opacity:0;transform:translate(-50%,-20px)}

/* ── 상단 바 ── */
.topbar{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:max(12px,env(safe-area-inset-top)) 16px 0;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{font-size:24px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.88);box-shadow:0 3px 0 #E2DCD2,0 8px 20px rgba(60,50,40,.08);transition:opacity .3s}
body[data-mode="attract"] .brand{opacity:0}
.icons{display:flex;gap:12px}
.help-q{font:700 30px var(--latin);color:var(--red)}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px}
.tl{font:700 12px var(--text);color:var(--ink);background:rgba(255,255,255,.85);border-radius:999px;padding:2px 9px;white-space:nowrap}
.ibtn{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(#fff,#F1F3F7);box-shadow:inset 0 2px 0 #fff,0 4px 0 #D4D9E1,0 8px 18px rgba(40,50,70,.14);color:var(--ink)}
.tool:active .ibtn{transform:translateY(3px);box-shadow:inset 0 2px 0 #fff,0 1px 0 #D4D9E1}
.ibtn img{width:40px;height:40px;object-fit:contain;mix-blend-mode:multiply}
.ibtn .count{position:absolute;right:-4px;top:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--red);color:#fff;
  font:700 13px/24px var(--text);box-shadow:0 2px 0 var(--redD)}
.tool.bump .ibtn{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.2)}}
body:not([data-session="1"]) .session-only{display:none}
body[data-mode="busy"] .icons .session-only,body[data-mode="coining"] .icons .session-only{opacity:.45;pointer-events:none}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px}
.ctl:first-child{gap:20px}
.vol-pop{position:fixed;right:16px;top:calc(max(12px,env(safe-area-inset-top)) + 92px);z-index:15;width:260px;padding:16px 18px;border-radius:22px;background:#fff;
  box-shadow:0 4px 0 #E2E6EC,0 16px 36px rgba(40,50,70,.2);display:flex;flex-direction:column;gap:14px;animation:sheet-in .25s}
.vol-pop[hidden]{display:none}
.vol-pop label{display:grid;grid-template-columns:62px 1fr 30px;align-items:center;gap:10px;font:700 14px var(--text)}
.vol-pop b{font:700 14px var(--latin);color:var(--red);text-align:right}
.vol-pop input{width:100%;accent-color:var(--red);height:28px}
.ctl-l{font:700 13px var(--text);color:#5A6170;letter-spacing:.02em;white-space:nowrap}

/* ── 조작판 ── */
.deck{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;
  width:min(760px,calc(100% - 20px));display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:18px;
  padding:16px 26px 22px;border-radius:34px;
  background:linear-gradient(180deg,#FFFFFF 0%,#F4F6F9 50%,#E8ECF1 100%);
  box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.04),0 10px 0 #D3D9E2,0 12px 0 #B8C0CC,0 26px 44px rgba(30,40,60,.3);
  transition:transform .4s,opacity .3s}
.deck::before{content:"";position:absolute;left:30px;right:30px;bottom:9px;height:5px;border-radius:5px;
  background:linear-gradient(90deg,#F0565B,#FF8A7A,#F0565B);box-shadow:inset 0 1px 1px rgba(0,0,0,.25)}
body[data-mode="prize"] .deck,body[data-mode="opening"] .deck,body[data-mode="menu"] .deck{transform:translate(-50%,140%);opacity:0}

/* 조이스틱 */
.joy{--s:132px;position:relative;width:var(--s);height:var(--s);border-radius:50%;touch-action:none;cursor:default}
.joy-plate{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,#454B57 0,#262A32 60%,#1A1D23 100%);
  box-shadow:0 0 0 7px #D5DBE3,0 0 0 9px #A9B2BE,0 7px 0 9px #8C95A2,inset 0 6px 14px rgba(0,0,0,.6),inset 0 -2px 4px rgba(255,255,255,.08)}
.joy-plate i{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9AA3AF 60%,#6D7581)}
.joy-plate i:nth-child(1){left:12%;top:12%}.joy-plate i:nth-child(2){right:12%;top:12%}.joy-plate i:nth-child(3){left:12%;bottom:12%}.joy-plate i:nth-child(4){right:12%;bottom:12%}
.joy-plate svg{position:absolute;inset:0;width:100%;height:100%}
.joy-boot{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,#30343C 0 3px,#1D2026 3px 6px);box-shadow:0 0 0 3px #15171B}
.joy-shaft{position:absolute;left:50%;top:50%;width:12px;margin-left:-6px;height:0;transform-origin:50% 0;border-radius:6px;
  background:linear-gradient(90deg,#7C8592,#E4E8EE 45%,#8A93A0)}
.joy-shadow{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-22px 0 0 -29px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(5px)}
.joy-ball{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:radial-gradient(circle at 36% 28%,#fff 0 7%,#FFD3E3 16%,#F59BBE 45%,#D9668F 78%,#A9406A 100%);
  box-shadow:inset -5px -8px 12px rgba(110,20,60,.35),0 2px 0 rgba(0,0,0,.15)}
.joy-ball::after{content:"";position:absolute;left:18%;top:12%;width:34%;height:22%;border-radius:50%;background:rgba(255,255,255,.65);transform:rotate(-30deg);filter:blur(1px)}
body[data-mode="play"] .joy{cursor:grab}
.joy.hint::before{content:"";position:absolute;inset:-18px;border-radius:50%;border:4px solid rgba(240,86,91,.6);animation:ring 1.1s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.15);opacity:0}}

/* 표시창 */
.panel-mid{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.segs{display:flex;gap:10px;padding:8px 10px;border-radius:16px;background:linear-gradient(#DDE2E9,#EEF1F5);box-shadow:inset 0 2px 4px rgba(0,0,0,.12),0 1px 0 #fff}
.seg{text-align:center;font:700 11px var(--text);color:var(--sub);letter-spacing:.06em}
.seg b{position:relative;display:block;font:400 32px/1 var(--mono);color:#FF4B4B;background:#111317;border-radius:8px;padding:6px 10px;margin-bottom:5px;
  text-shadow:0 0 8px rgba(255,75,75,.75);letter-spacing:3px;box-shadow:inset 0 2px 6px rgba(0,0,0,.8);overflow:hidden}
.seg b::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.14) 0 35%,transparent 36%)}
.seg.warn b{animation:blink .5s infinite}
@keyframes blink{50%{opacity:.35}}
.views{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:#E9EDF2;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.views img{width:28px;height:28px;margin:0 4px 0 2px}
.views button{font:700 13px var(--text);color:#5A6170;padding:7px 11px;border-radius:999px}
.views button.on{background:#fff;color:var(--red);box-shadow:0 2px 0 #CDD3DC}
.peek{position:fixed;right:max(clamp(12px,3vw,44px),env(safe-area-inset-right));top:max(25dvh,calc(env(safe-area-inset-top) + 94px));
  width:clamp(88px,25vw,min(34dvh,256px));z-index:8;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.peek[hidden]{display:none}
.peek canvas{width:100%;aspect-ratio:1;filter:drop-shadow(0 8px 12px rgba(30,40,60,.28))}
.peek b{font:400 clamp(14px,2vw,18px) var(--title);color:#fff;background:var(--red);border-radius:999px;padding:4px 10px;white-space:nowrap;box-shadow:0 3px 0 var(--redD)}
.peek.is-note b{background:#C79A2E;box-shadow:0 3px 0 #9A7420}
@media (max-height:480px){.peek{width:clamp(52px,calc(100dvh - 292px),min(25vw,166px))}}
.view-btn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 8px;border-radius:999px;color:#4A5160;font:700 13px var(--text);
  background:linear-gradient(#fff,#EEF1F5);box-shadow:inset 0 1px 0 #fff,0 4px 0 #CDD3DC}
.view-btn img{width:30px;height:30px;object-fit:contain;mix-blend-mode:multiply}
.view-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #CDD3DC}
.view-btn.side{color:var(--red)}

/* 동전 */
.coin{position:relative;width:78px;height:104px;border-radius:18px;
  background:linear-gradient(160deg,#F4F6F9,#BAC2CD);box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.08),0 6px 0 #9DA6B3,0 10px 16px rgba(0,0,0,.18)}
.coin .slot{position:absolute;left:50%;bottom:12px;width:10px;height:30px;margin-left:-5px;border-radius:5px;background:#16181D;box-shadow:inset 0 2px 3px #000,0 1px 0 #fff}
.coin .tok{position:absolute;left:50%;top:12px;z-index:1;width:46px;height:46px;margin-left:-23px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFF6C8 0 10%,#FFD45E 35%,#E9A92A 75%,#B47A12 100%);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.25),inset 0 -3px 0 rgba(120,70,0,.35),0 3px 0 #9C690C;
  display:grid;place-items:center;font:700 18px var(--latin);color:#A86F0B;text-shadow:0 1px 0 #FFE9A0}
body[data-mode="attract"] .coin .tok,body[data-mode="coin"] .coin .tok{animation:bob 1.1s ease-in-out infinite}
body[data-mode="attract"] .coin,body[data-mode="coin"] .coin{box-shadow:inset 0 2px 0 #fff,0 6px 0 #9DA6B3,0 0 0 4px rgba(255,200,70,.0),0 0 28px 6px rgba(255,196,60,.55)}
@keyframes bob{50%{transform:translateY(-6px)}}
.coin.insert .tok{animation:insert .55s ease-in forwards!important}
@keyframes insert{0%{transform:none}35%{transform:translateY(14px) rotateY(0)}70%{transform:translateY(26px) rotateY(82deg)}100%{transform:translateY(44px) rotateY(88deg) scaleY(.6);opacity:0}}
.coin:disabled{cursor:default}
body:not([data-mode="attract"]):not([data-mode="coin"]) .coin .tok{opacity:.35;filter:grayscale(.6)}

/* 뽑기 버튼 */
.push{position:relative;width:112px;height:112px;border-radius:50%;
  background:radial-gradient(circle,#2C3038 0 56%,#1C1F25 57% 62%,#C9D0DA 63% 72%,#8F98A5 73% 100%);box-shadow:0 6px 0 #6E7683,0 10px 18px rgba(0,0,0,.25)}
.push .cap{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-44px 0 0 -38px;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#FFC2B3 0 6%,#FF6A4C 30%,#E2361F 70%,#B4240F 100%);
  box-shadow:0 8px 0 #8C1A0C,inset 0 -6px 10px rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s}
.push .cap::after{content:"";position:absolute;left:20%;top:12%;width:38%;height:22%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-25deg);filter:blur(1px)}
.push:active .cap,.push.on .cap{transform:translateY(7px);box-shadow:0 1px 0 #8C1A0C,inset 0 -4px 8px rgba(0,0,0,.25)}
body:not([data-mode="play"]) .push .cap{filter:saturate(.35) brightness(1.05)}
body[data-mode="play"] .push{animation:glowR 1.6s ease-in-out infinite}
@keyframes glowR{50%{box-shadow:0 6px 0 #6E7683,0 0 26px 6px rgba(255,90,60,.45)}}

@media (max-width:560px),(max-height:560px){
  .deck{gap:10px;padding:12px 16px 18px;border-radius:28px}
  .joy{--s:104px}.joy-ball{width:50px;height:50px;margin:-25px 0 0 -25px}.joy-boot{width:38px;height:38px;margin:-19px 0 0 -19px}
  .push{width:88px;height:88px}.push .cap{width:60px;height:60px;margin:-35px 0 0 -30px}
  .coin{width:62px;height:86px}.coin .tok{width:38px;height:38px;margin-left:-19px;font-size:15px}
  .seg b{font-size:24px;padding:4px 8px}.segs{gap:6px;padding:6px}
}
@media (max-width:560px){
  .deck{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 6px;padding:10px 12px 16px}
  .panel-mid{grid-column:1 / -1;grid-row:1;flex-direction:row;justify-content:space-between}
  .views button{white-space:nowrap}
  .icons{gap:8px}.ibtn{width:48px;height:48px}.ibtn img{width:34px;height:34px}
}
@media (max-width:560px),(max-height:480px){
  .ctl:first-child{gap:12px}
  .joy{--s:76px}.joy-ball{width:42px;height:42px;margin:-21px 0 0 -21px}
  .push{width:76px;height:76px}.push .cap{width:52px;height:52px;margin:-30px 0 0 -26px}
  .coin{width:54px;height:64px}
}
@media (min-width:561px) and (max-height:480px){
  .panel-mid{flex-direction:row;justify-content:center}
}

/* ── 콜아웃·탭 표시 ── */
.callout{position:fixed;left:50%;top:22%;z-index:30;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;white-space:nowrap;
  font:400 clamp(30px,6vw,48px) var(--title);color:#fff;
  text-shadow:0 3px 0 var(--redD),3px 0 0 var(--redD),-3px 0 0 var(--redD),0 -3px 0 var(--redD),2px 2px 0 var(--redD),-2px 2px 0 var(--redD),2px -2px 0 var(--redD),-2px -2px 0 var(--redD),0 8px 18px rgba(0,0,0,.25)}
.callout.show{animation:pop 1.5s cubic-bezier(.3,1.5,.5,1) forwards}
.callout.gold{text-shadow:0 3px 0 #B47A12,3px 0 0 #B47A12,-3px 0 0 #B47A12,0 -3px 0 #B47A12,2px 2px 0 #B47A12,-2px 2px 0 #B47A12,2px -2px 0 #B47A12,-2px -2px 0 #B47A12,0 8px 18px rgba(0,0,0,.25)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.tap{position:fixed;z-index:12;width:150px;height:150px;margin:-75px 0 0 -75px;pointer-events:none;display:none}
body[data-mode="prize"] .tap{display:block}
.tap::before,.tap::after{content:"";position:absolute;inset:0;border-radius:50%;border:5px solid #fff;box-shadow:0 0 18px rgba(255,255,255,.8);animation:ring 1.3s ease-out infinite}
.tap::after{animation-delay:.65s}
.tap svg{position:absolute;right:-6px;bottom:-14px;width:56px;height:56px;animation:tapHand 1.3s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
@keyframes tapHand{50%{transform:translate(-6px,-8px) scale(.92)}}

/* ── 오버레이 ── */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(22,26,38,.5);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .3s}
@keyframes fade{from{opacity:0}}
.overlay[hidden]{display:none}
#sheetWrap{z-index:24}#warn,#confirm{z-index:28}
.sheet{position:relative;width:min(580px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;overflow-x:hidden;border-radius:30px;background:#fff;
  padding:26px 24px 22px;box-shadow:0 24px 70px rgba(0,0,0,.32);animation:sheet-in .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes sheet-in{from{transform:translateY(40px) scale(.95);opacity:0}}
.x{position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#F1F3F7;z-index:2}
.x svg{width:18px;height:18px}
.tag{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--text);letter-spacing:.04em;border-radius:999px;padding:5px 12px;
  background:color-mix(in srgb,var(--c) 26%,#fff);color:color-mix(in srgb,var(--c) 45%,#2F3442)}
.head{display:flex;gap:16px;align-items:center;padding-right:46px}
.head img{flex:0 0 100px;width:100px;height:100px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}
.head h2{font:400 23px/1.3 var(--title);margin:8px 0 4px}
.meta{font-size:14px;color:var(--sub);margin:0}
.kid{font:400 23px/1.45 var(--title);margin:18px 0;padding:16px 18px;border-radius:20px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.qr-row{display:flex;gap:18px;align-items:center;padding:14px;border-radius:22px;background:#F6F7FA}
.qr{flex:0 0 132px;height:132px;display:grid;place-items:center;background:#fff;border-radius:14px;padding:6px;box-shadow:0 2px 0 #E4E7EC}
.qr img,.qr canvas{width:120px;height:120px}
.qr-cap{display:flex;align-items:center;gap:10px;font:400 18px var(--title);color:var(--ink)}
.qr-cap svg{width:28px;height:28px;color:var(--red);flex:none}
.qr-side{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
.go-link{text-decoration:none;font-size:17px;padding:10px 20px}
.url{font-size:12px;color:var(--sub);word-break:break-all}
.pair{display:flex;gap:12px;align-items:center;margin-top:14px;padding:10px 14px;border-radius:20px;border:2px dashed #E3E6EC}
.pair img{flex:0 0 56px;width:56px;height:56px}
.pair img.ghost{filter:grayscale(.7) brightness(1.1);opacity:.55}
.pair b{display:block;font:400 17px var(--title)}
.pair span{font-size:13px;color:var(--sub)}
.pair .mini{margin-left:auto;font:400 15px var(--title);padding:8px 16px;border-radius:999px;background:#fff;box-shadow:0 3px 0 #D8DDE4;flex:none}
.foot{display:flex;justify-content:center;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:8px;font:400 19px var(--title);border-radius:999px;padding:12px 26px;background:#fff;color:var(--ink);box-shadow:0 4px 0 #D5DAE2}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--redD)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:0 4px 0 #15171B}
.btn:active{transform:translateY(3px);box-shadow:none}

/* 성찰 쪽지 */
.note{background:repeating-linear-gradient(180deg,var(--paper) 0 33px,#EFE6CF 33px 34px);border-top:14px solid color-mix(in srgb,var(--c) 70%,#fff)}
.note .head h2{font:700 26px/1.25 var(--hand)}
.note .kid{font:700 29px/1.35 var(--hand);background:none;padding:0 4px;margin:14px 0 16px}
.page{background:rgba(255,255,255,.75);border-radius:20px;padding:16px 18px;box-shadow:0 2px 0 #EADFC5}
.step-q{display:flex;align-items:center;gap:10px;font:400 20px var(--title);margin:0 0 8px}
.step-q .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--latin);color:#fff;background:color-mix(in srgb,var(--c) 70%,#2F3442)}
.step-a{font:400 23px/1.5 var(--hand);margin:0;min-height:4.6em}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:#DCD3BD}.dots i.on{background:var(--ink);width:24px;border-radius:5px}
.nav .btn{font-size:16px;padding:9px 18px}
.ov{display:none}
.note.all .ov{display:block}.note.all .pages{display:none}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov-card{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 0 #EADFC5}
.ov-card .step-q{font-size:16px;margin-bottom:6px}.ov-card .step-q .n{width:24px;height:24px;font-size:13px}
.ov-card p{margin:0;font:400 19px/1.4 var(--hand)}
.ov-back{display:flex;justify-content:center;margin-top:12px}
@media (max-width:480px){.ov-grid{grid-template-columns:1fr}.head img{flex-basis:76px;width:76px;height:76px}}

/* 컬렉션 */
.col{position:relative;width:min(780px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;border-radius:30px;background:#FFFDF8;padding:22px 22px 26px;box-shadow:0 24px 70px rgba(0,0,0,.32);animation:sheet-in .4s}
.col-top{display:flex;align-items:center;gap:14px;padding-right:52px;margin-bottom:18px}
.col-top h2{font:400 26px var(--title);margin:0;white-space:nowrap}
.prog{font:700 20px var(--latin);white-space:nowrap}.prog b{color:var(--red)}
.bar{flex:1;height:12px;border-radius:99px;background:#EEE8DC;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFB86B,var(--red));border-radius:99px;transition:width .6s}
.col-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tcard{position:relative;border-radius:22px;background:#fff;padding:14px 10px 12px;text-align:center;box-shadow:0 3px 0 #EEE6D8;border:2px solid transparent}
.tcard.complete{border-color:#FFD25E;background:linear-gradient(#FFFBEA,#fff)}
.star{position:absolute;top:-14px;right:-8px;width:36px;height:36px;display:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.tcard.complete .star{display:block;animation:bump .6s}
.slots{display:flex;justify-content:center;gap:10px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 12px var(--text);color:var(--sub)}
.slot .ic{position:relative;width:66px;height:66px;border-radius:50%}
.slot .ic img{width:100%;height:100%;filter:grayscale(.75) brightness(1.08) contrast(.85);opacity:.5;transition:.4s}
.slot .ic::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px dashed #CFC6B6}
.slot.got .ic img{filter:drop-shadow(0 3px 4px rgba(0,0,0,.15));opacity:1}
.slot.got .ic::after{content:none}
.slot.new .ic{animation:fill .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes fill{0%{transform:scale(.4)}60%{transform:scale(1.15)}}
.slot .pin{position:absolute;right:-6px;bottom:-4px;width:24px;height:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.slot:not(.got):active .ic{transform:scale(.94)}
.pair .mini{display:inline-flex;align-items:center;gap:4px}
.pair .mini .pin{width:18px;height:18px}
.topic{font:400 16px/1.3 var(--title);margin-top:10px}
.tsub{font-size:12px;color:var(--sub);margin-top:2px;min-height:1.2em}

/* 대화상자 */
.dialog{width:min(380px,100%);background:#fff;border-radius:28px;padding:26px 24px 24px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.32);animation:sheet-in .35s}
.dialog h3{font:400 23px var(--title);margin:0 0 6px}
.dialog p{margin:0 0 20px;color:var(--sub);font-size:14px}
.dialog .count{display:inline-block;font:400 52px/1 var(--mono);color:#FF4B4B;background:#111317;border-radius:14px;padding:10px 18px;margin:8px 0 20px;text-shadow:0 0 10px rgba(255,75,75,.7)}
.dialog .row{display:flex;gap:10px;justify-content:center}

.fly{position:fixed;z-index:40;width:120px;height:120px;pointer-events:none;transition:transform .8s cubic-bezier(.5,-0.3,.6,1),opacity .8s}
.nogl[hidden]{display:none}
.nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font:400 20px var(--title);z-index:50;background:#F1ECE4}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:45;background:#F1ECE4;transition:opacity .4s}
.loading .wordmark{font-size:56px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ── 대기 화면 안내 말풍선 ── */
.coin-ctl{position:relative}
.coin-tip{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);z-index:2;white-space:nowrap;pointer-events:none;
  font:400 17px var(--title);color:#fff;background:var(--red);border-radius:999px;padding:7px 14px;box-shadow:0 3px 0 var(--redD),0 8px 18px rgba(0,0,0,.18);
  animation:tipBob 1.4s ease-in-out infinite;display:none}
@keyframes tipBob{50%{transform:translate(-50%,-4px)}}   /* 가운데 정렬(translateX)을 유지한 채 위아래로만 */
.coin-tip::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--red)}
body[data-mode="attract"] .coin-tip,body[data-mode="coin"] .coin-tip{display:block}
body[data-tut="1"] .coin-tip{display:none}
body[data-tut="1"] .session-only{display:flex}
/* ── 튜토리얼 ── */
.tut{position:fixed;inset:0;z-index:40;pointer-events:none}
.tut[hidden]{display:none}
.tut-hole{position:fixed;border-radius:26px;box-shadow:0 0 0 200vmax rgba(14,17,26,.62);outline:4px solid #FFD25E;outline-offset:3px;
  transition:left .35s,top .35s,width .35s,height .35s}
.tut-card{position:fixed;width:min(340px,calc(100vw - 32px));background:#fff;border-radius:22px;padding:16px 18px 12px;pointer-events:auto;
  box-shadow:0 4px 0 #E2E6EC,0 16px 40px rgba(0,0,0,.32);animation:sheet-in .3s}
.tut-card .n{font:700 12px var(--text);color:var(--red);letter-spacing:.08em}
.tut-card h3{margin:4px 0 6px;font:400 22px var(--title);color:var(--ink)}
.tut-card p{margin:0;font:500 15px/1.55 var(--text);color:#4A5160}
.tut-card p b{color:var(--red)}
.tut-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.tut-skip{font:700 13px var(--text);color:var(--sub);padding:8px 2px}
.tut-ok{font:400 17px var(--title);color:#fff;background:var(--red);border-radius:999px;padding:8px 20px;box-shadow:0 3px 0 var(--redD)}
.tut-ok[hidden]{display:none}
</style>
</head>

  parts.ring.visible = S.mode === 'play';
  if (parts.ring.visible){ parts.ring.position.set(S.cx, surfaceY(S.cx, S.cz) + 0.004, S.cz); parts.ring.scale.setScalar(1 + Math.sin(now/180)*0.1); }
  if (S.pair && parts.pairMark.visible){
    const c = S.capsules.find(c => c.tid === S.pair.tid && c.kind === S.pair.kind);
    if (c){
      parts.pairMark.position.set(c.g.position.x, c.g.position.y + 0.11 + Math.abs(Math.sin(now/260))*0.03, c.g.position.z);
      parts.locRing.position.set(c.g.position.x, FLOOR + 0.004, c.g.position.z); parts.locRing.scale.setScalar(1 + Math.sin(now/200)*0.08);
    } else clearLocate();
  }
  if (S.prize && S.mode === 'prize'){
    S.prize.g.position.y = 0.145 + R + Math.abs(Math.sin(now/300))*0.01; S.prize.g.rotation.y += dt * 0.8;
    tmpV.copy(S.prize.g.position).project(camera);
    tapEl.style.left = ((tmpV.x + 1) / 2 * innerWidth) + 'px'; tapEl.style.top = ((1 - tmpV.y) / 2 * innerHeight) + 'px';
  }
  // 집게 아래에 있는 캡슐을 오른쪽에 미리 표시
  const target = S.mode === 'play' ? findTarget(S.cx, S.cz) : null;
  if (target){
    const k = key(target.tid, target.kind);
    if (preview.dataset.k !== k){
      preview.dataset.k = k;
      previewContext.clearRect(0, 0, 256, 256);
      drawCapsuleIcon(previewContext, target.tid, target.kind, true);
      previewKind.textContent = KIND_NAME[target.kind];
      preview.classList.toggle('is-note', target.kind === 2);
    }
  }
  const hidden = !target;
  if (preview.hidden !== hidden) preview.hidden = hidden;
  // 모터 소리
  if (SND.motor) setMotor((S.mode === 'play' && (dx || dz)) || S.motorOn ? 1 : 0, S.motorOn ? 0.8 : 1);
  if (S.camView === 'attract'){
    const a = Math.sin(now / 1000 * 0.22) * 0.75, r = 4.6 * fitK();
    camera.position.set(Math.sin(a) * r, 1.35, Math.cos(a) * r); camLook.set(0, 1.0, 0); camera.lookAt(camLook);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ═════════ 시작 ═════════ */
async function boot(){
  $('eventSub').textContent = DATA.event.subtitle;
  applyVol();
  try { await Promise.race([Promise.all(['700 40px Fredoka','40px Jua','700 40px Gaegu','40px "Share Tech Mono"'].map(f => document.fonts.load(f))), wait(2500)]); } catch(_) {}
  await Promise.all(TEACHERS.filter(t => t.character).map(t => new Promise(res => { const im = new Image(); im.onload = () => { t._img = im; res(); }; im.onerror = res; im.src = t.character; })));
  buildMachine(); fillPile(); resize(); updateColCount();
  setMode('attract'); updateDisplay();
  requestAnimationFrame(frame);
  const l = $('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 400);
}
boot();
window.__cap = { S, CFG, SND, drop, insertCoin, openPrize, resetSession, openCollection, closeSheet, camTo };
